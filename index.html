    :root{
      --primary:#a72c32;
      --secondary:#1e1e1e;
      --accent:#de3e46;
      --bg:#f8fafc;
      --text:#0f172a;
      --muted:#64748b;
      --border:#e2e8f0;
      --card:#ffffff;
      --soft:#f1f5f9;
      --success:#10b981;
      --warning:#f59e0b;
      --danger:#ef4444;
      --gantt-complete:#10b981;
      --gantt-progress:#f59e0b;
      --gantt-pending:#94a3b8;
      --notif-warning30:#f59e0b;
      --notif-warning7:#fb923c;
      --notif-overdue7:#ef4444;
      --notif-overdue30:#991b1b;
    }
    *{ box-sizing:border-box; }
    body{ margin:0; font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif; background:var(--bg); color:var(--text); }
    button{ font-family:inherit; }
    
    /* Login Page Styles */
    .loginContainer{
      min-height:100vh; display:grid; place-items:center; padding:20px;
      background:linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
    }
    .loginCard{
      background:#fff; border-radius:28px; padding:40px;
      box-shadow:0 20px 60px rgba(0,0,0,.3);
      width:100%; max-width:420px;
      animation: slideUp 0.5s ease-out;
    }
    @keyframes slideUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }

    .loginLogo{
      width:64px; height:64px; border-radius:20px; background:var(--primary);
      display:grid; place-items:center; font-weight:900; font-size:32px;
      color:#fff; margin:0 auto 24px;
    }
    .loginTitle{ font-size:28px; font-weight:900; text-align:center; margin-bottom:8px; }
    .loginSubtitle{ text-align:center; color:var(--muted); font-weight:700; font-size:14px; margin-bottom:32px; }
    .loginForm{ display:grid; gap:20px; }
    .loginField{ display:grid; gap:8px; }
    .loginLabel{ font-size:12px; font-weight:800; color:var(--muted); text-transform:uppercase; }
    .loginInput{
      width:100%; padding:14px; border-radius:14px; border:2px solid var(--border);
      font-weight:600; font-size:15px; outline:none; transition:all .2s;
    }
    .loginInput:focus{ border-color:var(--primary); background:#fff; }
    .loginButton{
      width:100%; padding:16px; border-radius:14px; border:0;
      background:var(--primary); color:#fff; font-weight:800; font-size:16px;
      cursor:pointer; transition:all .2s;
    }
    .loginButton:hover{ background:var(--accent); transform:translateY(-2px); }
    .loginButton:active{ transform:translateY(0); }
    .demoAccounts{
      margin-top:24px; padding:16px; background:#f8fafc; border-radius:16px;
      border:1px dashed var(--border);
    }
    .demoTitle{ font-size:11px; font-weight:800; color:var(--muted); text-transform:uppercase; margin-bottom:12px; }
    .demoAccount{
      display:flex; justify-content:space-between; align-items:center;
      padding:10px; background:#fff; border-radius:12px; margin-bottom:8px;
      cursor:pointer; transition:all .2s; border:1px solid var(--border);
    }
    .demoAccount:hover{ border-color:var(--primary); transform:translateX(4px); }
    .demoRole{ font-weight:800; font-size:13px; }
    .demoCredentials{ font-size:11px; color:var(--muted); font-weight:600; }
    .errorMsg{
      padding:12px; background:#fee2e2; color:#991b1b; border-radius:12px;
      font-weight:700; font-size:13px; text-align:center; margin-bottom:16px;
    }
    
    /* Main App Layout */
    .app{ display:flex; height:100vh; overflow:hidden; }
    .sidebar{
      width:280px; background:var(--secondary); color:#fff;
      padding:20px; display:flex; flex-direction:column;
      transition:transform .3s ease; flex-shrink:0;
    }
    .brand{ display:flex; align-items:center; gap:10px; margin-bottom:24px; }
    .logo{ width:34px; height:34px; border-radius:10px; background:var(--primary); display:grid; place-items:center; font-weight:900; }
    .navbtn{
      width:100%; display:flex; align-items:center; gap:12px;
      padding:12px 14px; border-radius:12px; border:0; cursor:pointer;
      background:transparent; color:rgba(255,255,255,.7);
      font-weight:700; text-transform:uppercase; font-size:12px; letter-spacing:.5px;
      margin-bottom:4px; transition:all .2s;
    }
    .navbtn:hover{ background:rgba(255,255,255,.1); color:#fff; }
    .navbtn.active{ background:var(--primary); color:#fff; box-shadow:0 4px 12px rgba(0,0,0,.2); }
    .main{ flex:1; display:flex; flex-direction:column; min-width:0; background:#f1f5f9; }
    .header{
      height:64px; background:#fff; border-bottom:1px solid var(--border);
      display:flex; align-items:center; justify-content:space-between; padding:0 24px;
      flex-shrink:0; position: sticky; top: 0; z-index: 10;
    }
    .hamburger{
      display:none; width:40px; height:40px; border:0; background:var(--soft);
      border-radius:12px; cursor:pointer; font-size:20px; align-items:center;
      justify-content:center;
    }
    .content{ padding:24px; overflow:auto; flex:1; }
    .grid4{ display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:16px; }
    .card{
      background:var(--card); border:1px solid var(--border); border-radius:20px;
      padding:20px; box-shadow:0 4px 12px rgba(15,23,42,.03);
      transition:transform 0.2s;
    }
    .cardTitle{ font-size:12px; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing: 0.5px; }
    .cardValue{ font-size:28px; font-weight:800; margin-top:8px; color:var(--text); }
    .row{ display:flex; gap:16px; flex-wrap:wrap; margin-top:16px; }
    .half{ flex:1 1 400px; }
    .btnPrimary{
      background:var(--primary); color:#fff; border:0; padding:10px 16px;
      border-radius:10px; font-weight:700; cursor:pointer; transition:all .2s;
      display: inline-flex; align-items: center; gap: 8px; font-size: 13px;
    }
    .btnPrimary:hover{ background:var(--accent); box-shadow:0 4px 12px rgba(167,44,50,.3); }
    .btnPrimary:disabled{ opacity:.5; cursor:not-allowed; box-shadow:none; }
    .btnSoft{
      background:var(--soft); color:#475569; border:1px solid var(--border);
      padding:10px 16px; border-radius:10px; font-weight:700; cursor:pointer; transition:all .2s;
      display: inline-flex; align-items: center; gap: 8px; font-size: 13px;
    }
    .btnSoft:hover{ background:#e2e8f0; color:#1e293b; }
    .pill{ display:inline-flex; align-items: center; padding:4px 10px; border-radius:99px; font-size:11px; font-weight:800; letter-spacing: 0.3px; }
    .pill.gray{ background:#f1f5f9; color:#475569; }
    .pill.green{ background:#dcfce7; color:#166534; }
    .pill.yellow{ background:#fef9c3; color:#854d0e; }
    .pill.red{ background:#fee2e2; color:#991b1b; }
    .pill.blue{ background:#dbeafe; color:#1e40af; }
    table{ width:100%; border-collapse:separate; border-spacing: 0; }
    th{
      text-align:left; font-size:11px; color:var(--muted);
      text-transform:uppercase; letter-spacing:.8px; padding:16px;
      background:#f8fafc; border-bottom:1px solid var(--border);
      font-weight: 800; position: sticky; top: 0;
    }
    td{ padding:16px; border-bottom:1px solid var(--border); font-size:13px; vertical-align:middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #f8fafc; }
    
    .modalOverlay{
      position:fixed; inset:0; background:rgba(0,0,0,.6); backdrop-filter: blur(4px);
      display:grid; place-items:center; padding:16px; z-index:2000;
      animation: fadeIn 0.2s ease-out;
    }
    @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
    .modal{
      width:min(1100px,96vw); max-height:92vh; background:#fff; border-radius:24px;
      overflow:hidden; display:flex; flex-direction:column;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      animation: scaleUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes scaleUp { from { transform:scale(0.95); opacity:0; } to { transform:scale(1); opacity:1; } }
    
    .modalHead{
      padding:20px 24px; background:#fff; border-bottom:1px solid var(--border);
      display:flex; align-items:center; justify-content:space-between; flex-shrink:0;
    }
    .modalBody{ padding:24px; overflow:auto; }
    .label{ font-size:11px; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; margin-bottom:8px; }
    input, select, textarea{
      width:100%; padding:12px; border-radius:12px; border:1px solid var(--border);
      background:#fff; font-weight:600; outline:none; font-size:14px;
      transition: all 0.2s; color: var(--text);
    }
    input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(167,44,50,0.1); }
    textarea{ min-height:100px; resize:vertical; line-height: 1.5; }
    .muted{ color:var(--muted); font-weight:600; font-size:12px; }
    .dividerL{ padding-left:16px; border-left:3px solid var(--border); margin-left: 4px; }
    .danger{ color:var(--danger); font-weight:700; display:flex; gap:6px; align-items:center; font-size: 12px; }
    .ellipsis{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .checkboxWrapper{ display:flex; align-items:center; gap:8px; cursor:pointer; padding:8px; border-radius:8px; }
    .checkboxWrapper:hover{ background:#f1f5f9; }
    .checkbox{ width:18px; height:18px; cursor:pointer; accent-color:var(--primary); }
    .selectionInfo{
      background:#eff6ff; border:1px solid #dbeafe; border-radius:16px; padding:16px;
      display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;
    }
    .userInfo{
      display:flex; align-items:center; gap:12px; padding:12px; background:rgba(255,255,255,.08);
      border-radius:12px; margin-bottom:10px;
    }
    .userAvatar{
      width:40px; height:40px; border-radius:999px; background:var(--primary);
      display:grid; place-items:center; font-weight:800; flex-shrink:0; font-size: 18px;
    }
    .roleBadge{
      padding:4px 8px; border-radius:6px; font-size:10px; font-weight:800;
      text-transform:uppercase; letter-spacing:.5px;
    }
    .roleBadge.admin{ background:var(--danger); color:#fff; }
    .roleBadge.user{ background:#3b82f6; color:#fff; }
    
    /* Notification Toast */
    .toast-container {
      position: fixed; bottom: 24px; right: 24px; z-index: 3000;
      display: flex; flex-direction: column; gap: 10px; pointer-events: none;
    }
    .toast {
      background: #fff; padding: 16px; border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15); border-left: 4px solid var(--primary);
      display: flex; align-items: center; gap: 12px; width: 320px;
      pointer-events: auto; animation: slideInRight 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .toast.error { border-color: var(--danger); }
    .toast.success { border-color: var(--success); }
    @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    /* Responsive Design */
    @media (max-width: 768px) {
      .sidebar{
        position:fixed; left:0; top:0; bottom:0; z-index:1001;
        transform:translateX(-100%); width:280px;
        box-shadow:none;
      }
      .sidebar.open{ transform:translateX(0); box-shadow:4px 0 40px rgba(0,0,0,.5); }
      .hamburger{ display:flex !important; }
      .header{ padding:0 16px; }
      .content{ padding:16px; }
      .grid4{ grid-template-columns:1fr; }
      .row{ flex-direction:column; }
      .half{ flex:1 1 100%; }
      .card{ padding:16px; }
      .cardValue{ font-size:24px; }
      .loginCard{ padding:24px; border-radius: 20px; }
      .loginTitle{ font-size:24px; }
      .modal{ width:100vw; height:100vh; max-height:100vh; border-radius:0; }
      table{ display:block; overflow-x:auto; white-space:nowrap; }
      .selectionInfo{ flex-direction:column; align-items:stretch; text-align: center; }
    }
    
    .sidebarOverlay{
      display:none; position:fixed; inset:0; background:rgba(0,0,0,.6);
      z-index:1000; opacity: 0; transition:opacity .3s ease;
    }
    .sidebarOverlay.show{ display:block; opacity: 1; }
    
    /* Notification Styles */
    .notificationPanel{
      background:#fff; border:1px solid var(--border); border-radius:16px;
      padding:20px; max-height:400px; overflow-y:auto;
    }
    .notificationItem{
      padding:12px; border-radius:10px; margin-bottom:8px;
      border-left:4px solid var(--muted); cursor:pointer;
      transition:all .2s; display:flex; align-items:center; gap:12px;
    }
    .notificationItem:hover{ background:var(--soft); transform:translateX(4px); }
    .notificationItem.overdue_30{ border-left-color:var(--notif-overdue30); background:#fef2f2; }
    .notificationItem.overdue_7{ border-left-color:var(--notif-overdue7); background:#fee2e2; }
    .notificationItem.warning_7{ border-left-color:var(--notif-warning7); background:#ffedd5; }
    .notificationItem.warning_30{ border-left-color:var(--notif-warning30); background:#fef9c3; }
    .notifBadge{
      position:absolute; top:-6px; right:-6px; background:var(--danger);
      color:#fff; border-radius:99px; padding:2px 6px;
      font-size:10px; font-weight:800; min-width:18px; text-align:center;
    }
    .notifIndicator{
      display:inline-flex; align-items:center; justify-content:center;
      width:24px; height:24px; border-radius:50%; font-size:12px;
      flex-shrink:0; border:2px solid;
    }
    .notifIndicator.on_track{ background:#dcfce7; border-color:#10b981; color:#166534; }
    .notifIndicator.warning_30{ background:#fef9c3; border-color:#f59e0b; color:#854d0e; }
    .notifIndicator.warning_7{ background:#ffedd5; border-color:#fb923c; color:#9a3412; }
    .notifIndicator.overdue_7{ background:#fee2e2; border-color:#ef4444; color:#991b1b; }
    .notifIndicator.overdue_30{ 
      background:#fecaca; border-color:#991b1b; color:#7f1d1d; 
      animation:pulse 1s infinite;
    }
    @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.6;} }
  </style>

  // Calculate notification status based on end date
  function calculateNotificationStatus(endDate){
    if(!endDate) return {status:"on_track",color:"green",icon:"✓",message:""};
    const today=new Date();
    const end=new Date(endDate);
    const diffDays=Math.ceil((end-today)/(1000*60*60*24));
    
    if(diffDays>=30) return {status:"on_track",color:"green",icon:"✓",message:""};
    if(diffDays>=7) return {status:"warning_30",color:"#f59e0b",icon:"⚠",message:`ใกล้ครบกำหนด ${diffDays} วัน`};
    if(diffDays>=0) return {status:"warning_7",color:"#fb923c",icon:"⚠⚠",message:`ใกล้ครบกำหนด ${diffDays} วัน`};
    if(diffDays>=-7) return {status:"overdue_7",color:"#ef4444",icon:"🚨",message:`เลยกำหนดมา ${Math.abs(diffDays)} วัน`};
    return {status:"overdue_30",color:"#991b1b",icon:"🚨🚨",message:`เลยกำหนดมา ${Math.abs(diffDays)} วัน`};
  }

  // Calculate planned progress based on dates
  function calculatePlannedProgress(startDate,endDate){
    if(!startDate||!endDate) return 0;
    const start=new Date(startDate);
    const end=new Date(endDate);
    const today=new Date();
    if(today<start) return 0;
    if(today>end) return 100;
    const total=end-start;
    const elapsed=today-start;
    return Math.min(100,Math.max(0,Math.round((elapsed/total)*100)));
  }

  // Calculate cumulative KPI from monthly data
  function calculateCumulativeKPI(monthlyData){
    if(!monthlyData||monthlyData.length===0) return {target:0,actual:0,achievement:0};
    const target=monthlyData.reduce((sum,m)=>sum+Number(m.target||0),0);
    const actual=monthlyData.reduce((sum,m)=>sum+Number(m.actual||0),0);
    const achievement=target>0?Math.round((actual/target)*100):0;
    return {target,actual,achievement};
  }

  // Check project completeness
  function checkProjectCompleteness(project){
    const missing=[];
    if(!project.start_date) missing.push("วันที่เริ่มต้น");
    if(!project.end_date) missing.push("วันที่สิ้นสุด");
    if(!project.sapa_approved||project.sapa_approved===0) missing.push("งบประมาณ");
    if(!project.outcomes||project.outcomes.length===0) missing.push("ผลสัมฤทธิ์");
    return {
      complete:missing.length===0,
      missing:missing,
      completeness_score:Math.round(((4-missing.length)/4)*100)
    };
  }

  // Get all notifications from data
  function getAllNotifications(data){
    const notifications=[];
    const processItem=(item,level,mission,project,parent)=>{
      if(!item.end_date) return;
      const status=calculateNotificationStatus(item.end_date);
      if(status.status!=="on_track"){
        notifications.push({level,item,status,mission,project,parent});
      }
    };
    
    data.forEach(m=>{
      m.main_projects?.forEach(p=>{
        processItem(p,"project",m,p,null);
        p.sub_projects?.forEach(sp=>{
          processItem(sp,"sub_project",m,p,sp);
          sp.topics?.forEach(tp=>{
            processItem(tp,"topic",m,p,tp);
            tp.details?.forEach(d=>{
              processItem(d,"activity",m,p,d);
            });
          });
        });
      });
    });
    
    const order={overdue_30:0,overdue_7:1,warning_7:2,warning_30:3};
    return notifications.sort((a,b)=>order[a.status.status]-order[b.status.status]);
  }

  function normalizeStatusProgress(status, progress){
    const p = clamp(progress);
    const s = status || "pending";
    if (s==="completed" || p===100) return { status:"completed", progress:100 };
    if (p>0) return { status:"in_progress", progress:p };
    return { status:"pending", progress:0 };
  }

  function computeProjectKPI(project){
    let total=0, earned=0;
    (project.sub_projects||[]).forEach(sp=>{
      (sp.topics||[]).forEach(tp=>{
        (tp.details||[]).forEach(d=>{
          const pts=Number(d.points||0);
          const prog=clamp(d.progress);
          total += pts;
          earned += pts*(prog/100);
        });
      });
    });
    const progress = total>0 ? Math.round((earned/total)*100) : 0;
    return { total, earned, progress };
  }

  function computeMissionKPI(mission){
    let total=0, earned=0;
    (mission.main_projects||[]).forEach(p=>{
      const k=computeProjectKPI(p);
      total += k.total; earned += k.earned;
    });
    const progress = total>0 ? Math.round((earned/total)*100) : 0;
    return { total, earned, progress };
  }

  function recomputeAll(data){
    return (data||[]).map(m=>{
      // Recompute mission-level planned_progress and notification_status
      const mPlanned = calculatePlannedProgress(m.start_date, m.end_date);
      const mNotif = calculateNotificationStatus(m.end_date);
      
      const main_projects = (m.main_projects||[]).map(p=>{
        const k=computeProjectKPI(p);
        const pPlanned = calculatePlannedProgress(p.start_date, p.end_date);
        const pNotif = calculateNotificationStatus(p.end_date);
        
        // Recompute sub_projects
        const sub_projects = (p.sub_projects||[]).map(sp=>{
          const spPlanned = calculatePlannedProgress(sp.start_date, sp.end_date);
          const spNotif = calculateNotificationStatus(sp.end_date);
          
          // Recompute topics
          const topics = (sp.topics||[]).map(tp=>{
            const tpPlanned = calculatePlannedProgress(tp.start_date, tp.end_date);
            const tpNotif = calculateNotificationStatus(tp.end_date);
            
            // Recompute details/activities
            const details = (tp.details||[]).map(d=>{
              const dPlanned = calculatePlannedProgress(d.start_date, d.end_date);
              const dNotif = calculateNotificationStatus(d.end_date);
              return {...d, planned_progress:dPlanned, notification_status:dNotif.status};
            });
            
            return {...tp, details, planned_progress:tpPlanned, notification_status:tpNotif.status};
          });
          
          return {...sp, topics, planned_progress:spPlanned, notification_status:spNotif.status};
        });
        
        return { ...p, sub_projects, progress:k.progress, kpi_total_points:k.total, planned_progress:pPlanned, notification_status:pNotif.status };
      });
      const mk = computeMissionKPI({ ...m, main_projects });
      return { ...m, main_projects, progress:mk.progress, kpi_total_points:mk.total, planned_progress:mPlanned, notification_status:mNotif.status };
    });
  }

  function ComparisonGauge({ planned=0, actual=0, label="" }){
    const p = clamp(planned);
    const a = clamp(actual);
    const deviation = a - p;
    const ratio = p > 0 ? (a / p) : 0;
    
    // Color based on performance
    let color = "#10b981"; // green - good
    if(ratio < 0.5) color = "#ef4444"; // red - poor
    else if(ratio < 1.0) color = "#f59e0b"; // yellow - moderate
    
    const radius=40, cx=50, cy=50;
    const startX=cx-radius, startY=cy, endX=cx+radius, endY=cy;
    const arcLength=Math.PI*radius;
    
    // Outer arc (planned) - thinner, lighter
    const plannedStroke = 6;
    const plannedDash = (arcLength * p) / 100;
    
    // Inner arc (actual) - thicker, colored
    const actualStroke = 8;
    const actualDash = (arcLength * a) / 100;
    
    return React.createElement("div", { 
      style:{ display:"flex", flexDirection:"column", alignItems:"center", position:"relative"} 
    },
      React.createElement("svg", { width:100, height:60, viewBox:"0 0 100 60" },

          fill:"none", stroke:"#e2e8f0", strokeWidth:plannedStroke+2, strokeLinecap:"round"

        React.createElement("path", {

          fill:"none", stroke:"#94a3b8", strokeWidth:plannedStroke, strokeLinecap:"round",

    function exportGanttTable(items, projectName=""){

        "2569-04","2569-05","2569-06","2569-07","2569-08","2569-09"
      ];
      
      const isInDateRange = (monthValue, startDate, endDate) => {
        if(!startDate || !endDate) return false;
        const monthDate = new Date(monthValue + "-01");
        const start = new Date(startDate);
        const end = new Date(endDate);
        return monthDate >= new Date(start.getFullYear(), start.getMonth(), 1) && 
               monthDate <= new Date(end.getFullYear(), end.getMonth() + 1, 0);
      };
      
      // Header
      const tableData = [
        ["แผนปฏิบัติงาน Gantt Chart - " + (projectName || "โครงการ")],
        ["ปีงบประมาณ 2569 (ตุลาคม 2568 - กันยายน 2569)"],
        [],
        ["โครงการ/กิจกรรม", "ผู้รับผิดชอบ", "สถานะ", ...months]
      ];
      
      // Data rows
      items.forEach(item=>{
        const row = [
          item.name || "ไม่มีชื่อ",
          item.responsible || "-",
          item.progress >= 100 ? "เสร็จสิ้น" : item.progress > 0 ? "กำลังดำเนินการ" : "รอดำเนินการ"
        ];
        
        // Add x marks for each month
        monthValues.forEach(monthValue=>{
          const hasWork = isInDateRange(monthValue, item.start_date, item.end_date);
          row.push(hasWork ? "x" : "");
        });
        
        tableData.push(row);
      });
      
      const ws = XLSX.utils.aoa_to_sheet(tableData);
      
      // Set column widths
      ws['!cols'] = [
        {wch:40}, // โครงการ
        {wch:20}, // ผู้รับผิดชอบ
        {wch:15}, // สถานะ
        ...months.map(()=>({wch:6})) // เดือนต่างๆ
      ];
      
      XLSX.utils.book_append_sheet(wb, ws, "Gantt Chart");
      XLSX.writeFile(wb, `Gantt_Table_${projectName.replace(/[^a-zA-Z0-9ก-๙]/g,'_')}_${new Date().toISOString().split('T')[0]}.xlsx`);
      toast("Export Gantt Table สำเร็จ", "success");
    }
